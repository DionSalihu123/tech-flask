<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
    <meta name = "Author" description = "Dion Salihu">
    <meta name = "About" description = "Selling"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='shporta.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>tech</title>
</head>
<body>

<header>
    <nav class="starter">
        <div class="linking">
            <a href="/" id="go-back"><i class="fa-solid fa-backward-step"></i></a>
            <a href="#" id="starter-logo"><i class="fa-brands fa-sketch"></i></a>
        </div>


        <ul class="starter-icons">
            <li><a href="{{ url_for('shporta') }}"><i class="fa-solid fa-cart-shopping"></i></a></li>
            <li><a href="favorites.html"><i class="fa-solid fa-heart"></i></a></li>
            <div id="profile-continer">
                <li><a href="{{ url_for('login') }}"><i class="fa-solid fa-user"></i></a></li>
                <span id="username-display"></span>
                <button id="logout-btn" type="button">Logout</button>
            </div>
        </ul>
    </nav>
</header>

<main>
    <div class="inside">
        <h2>Shporta</h2>

        <ul class="upper-links">
            <li>Produktet:</li>
            <li>Cmimi:</li>
            <li>Sasia:</li>
            <li>Total:</li>
            <li id="trash"><a href="" onclick="clearCart()"><i class="fa-solid fa-trash"></i></a></li>
        </ul>

        {% for item in session.get('cart', []) %}
        <div class="box">
            <div class="imgEdes">
                <img src="{{ item.image }}" alt="{{ item.name }}">
                <p>{{ item.name }}</p>
            </div>
            <div class="cmimi">
                <p>${{ item.price }}</p>
            </div>
            <div class="sasia">
                <div class="sasia-content">
                    <p>{{ item.quantity }}</p>
                </div>
            </div>
            <div class="total">
                <p>${{ item.price * item.quantity }}</p>
            </div>
            <div class="trash-div">
                <a href="{{ url_for('remove_from_cart', product_id=item.id) }}">
                    <i class="fa-solid fa-trash"></i>
                </a>
            </div>
        </div>
    {% endfor %}
    </div>
</main>



</body>
</html>

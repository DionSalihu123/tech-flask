<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
    <meta name = "Author" description = "Dion Salihu">
    <meta name = "About" description = "Selling"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <title>tech</title>
</head>
<body>
    <header>
        <nav class="starter">
            <div class="linking">
                <a href="/" id="go-back"><i class="fa-solid fa-backward-step"></i></a>
                <a href="#" id="starter-logo"><i class="fa-brands fa-sketch"></i></a>
            </div>

           
            <ul class="starter-icons">
                <li><a href="{{ url_for('shporta') }}"><i class="fa-solid fa-cart-shopping"></i></a></li>
                <li><a href="favorites.html"><i class="fa-solid fa-heart"></i></a></li>
                <li><a href="{{ url_for('login') }}"><i class="fa-solid fa-user"></i></a></li>
            </ul>
        </nav>
    </header>

    <div class = "main-log">

        <div class = "login">

            <div class = "login-form">
                <h2>Login</h2>

                {% with messages = get_flashed_messages() %}
                {% if messages %}
                <ul class="flash-messages">
                    {% for message in messages %}
                    <li>{{ message }}</li>
                    {% endfor %}
                </ul>
                {% endif %}
                {% endwith %}

                
                <form action="/login" method="post">

                    <div class="eml">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>

                    <div class="psw">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder = "password" required>
                    </div>

                    <button type="submit">Login</button>

                </form>

                <p class = "register">If you do not have an account <a href = "{{ url_for('register') }}">Register</a></p>
            </div>

        </div>

    </div>
</body>
</html>
